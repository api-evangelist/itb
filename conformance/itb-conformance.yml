generated: '2026-09-01'
method: probed
source: >-
  Live probes of ITB's own hosts on 2026-09-01 (journals.itb.ac.id,
  login.itb.ac.id, digilib.itb.ac.id, shibboleth.itb.ac.id) plus registry
  lookups against api.crossref.org, api.ror.org and api.datacite.org.
regime: education
basis: >-
  ITB publishes no OpenAPI, AsyncAPI or other specification, so nothing here is
  derived from a contract — every entry is a direct protocol probe or a registry
  record. Targets are the Kin Score `education` regime standards[]. Every
  `conforms: false` means "probed or searched on 2026-09-01 and not found", and
  the URL and status that establish it are given. Reward-only: no conformance is
  asserted without a fetched response behind it.
standards:
- id: oai-pmh
  conforms: true
  evidence: >-
    https://journals.itb.ac.id/index.php/index/oai?verb=Identify returned 200
    text/xml with <protocolVersion>2.0</protocolVersion>,
    <repositoryName>ITB Journals</repositoryName>,
    <adminEmail>journal@itb.ac.id</adminEmail>,
    <granularity>YYYY-MM-DDThh:mm:ssZ</granularity>,
    <deletedRecord>persistent</deletedRecord> and gzip/deflate compression
    declarations. verb=ListSets returned 200 with 20 <setSpec> entries across
    the ITB journal titles (jmfs, jets, jictra, jpwk and their article,
    editorial and review subsets). verb=ListRecords&metadataPrefix=oai_dc
    returned 200. Per-journal base URLs also answer, e.g.
    https://journals.itb.ac.id/index.php/jmfs/oai?verb=Identify (200). The
    endpoint runs on ITB's own domain and is administered by ITB; the toolkit
    behind it is Open Journal Systems 3.2.1.0 (Public Knowledge Project), whose
    generic contract is not attributed to ITB.
- id: crossref
  conforms: true
  evidence: >-
    https://api.crossref.org/prefixes/10.5614 (200) resolves prefix 10.5614 to
    Crossref member 3613, "The Institute for Research and Community Services
    (LPPM) ITB". https://api.crossref.org/members/3613 (200) reports
    total-dois 6568 (current 1040, backfile 5528). ITB is the registrant; the
    Crossref API is Crossref's.
- id: datacite
  conforms: false
  evidence: >-
    https://api.datacite.org/providers?query=Bandung and
    https://api.datacite.org/clients?query=Teknologi%20Bandung both returned 200
    with meta.total 0. No ITB DataCite provider or repository account exists.
    ITB's DOI registration runs through Crossref, not DataCite.
- id: saml
  conforms: false
  evidence: >-
    https://login.itb.ac.id/cas/idp/metadata returned 404 (Spring JSON error
