    returned 404, so the CAS server exposes neither SAML IdP metadata nor an
    OIDC discovery document. No SAML entity descriptor was found on any ITB
    host.
- id: shibboleth
  conforms: false
  evidence: >-
    shibboleth.itb.ac.id resolves in DNS to 167.205.50.61 but the host accepts
    no HTTP or HTTPS connection (curl exit, status 0) on either
    https://shibboleth.itb.ac.id/ or
    https://shibboleth.itb.ac.id/idp/shibboleth. Indonesia operates no eduGAIN
    member federation carrying itb.ac.id entities. ITB's federation surface is
    Apereo CAS, which is campus SSO rather than SAML federation metadata.
- id: orcid
