apis:
  - aid: itb:sso-cas
    name: ITB Single Sign-On (CAS)
    x-operator: institution
    description: >-
      ITB's campus-wide single sign-on, built on the Apereo CAS (Central
      Authentication Service) protocol and running on ITB's own host
      login.itb.ac.id. The CAS 2.0 and CAS 3.0 ticket-validation endpoints are
      publicly reachable and return machine-readable cas:serviceResponse XML —
      verified 2026-09-01, /cas/p3/serviceValidate returned 200
      application/xml with an INVALID_TICKET authenticationFailure for a
      synthetic ticket. No SAML or OIDC metadata is exposed (/cas/idp/metadata
      and /cas/oidc/.well-known/openid-configuration both 404), and
      shibboleth.itb.ac.id resolves in DNS but serves nothing, so ITB has no
      evidenced Shibboleth/SAML federation entry. Service registration and
      account provisioning are restricted to ITB-affiliated applications, and
      ITB publishes no specification for this surface.
    humanURL: https://login.itb.ac.id/
    baseURL: https://login.itb.ac.id/cas/
    tags: [Authentication, SSO, CAS, Identity]
    properties:
      - type: Documentation
        url: https://login.itb.ac.id/
      - type: Authentication
        url: https://login.itb.ac.id/cas/login
  - aid: itb:journals-oai
    name: ITB Journals OAI-PMH
    x-operator: institution
    description: >-
      ITB's scholarly journal platform at journals.itb.ac.id, hosted on ITB's
      own domain and administered by ITB (OAI Identify returns repositoryName
      "ITB Journals" and adminEmail journal@itb.ac.id). It exposes a live,
      unauthenticated OAI-PMH 2.0 data provider — verified 2026-09-01, verb
      Identify returned 200 text/xml with protocolVersion 2.0, granularity
      YYYY-MM-DDThh:mm:ssZ and gzip/deflate compression, and verb ListSets
      returned 20 sets across the ITB journal titles (jmfs, jets, jictra, jpwk
      and their article/editorial subsets). Per-journal OAI base URLs exist too
      (e.g. /index.php/jmfs/oai). The endpoint is ITB's; the software is Open
      Journal Systems 3.2.1.0 from the Public Knowledge Project, so PKP's
      generic OJS contract is deliberately NOT saved under this institution.
      The OJS REST API on the same host is credential-gated —
      /index.php/jmfs/api/v1/issues returned 403 api.403.unauthorized.
    humanURL: https://journals.itb.ac.id/
    baseURL: https://journals.itb.ac.id/index.php/index/oai
    tags: [OAI-PMH, Scholarly Publishing, Open Journal Systems, Metadata Harvesting, Research]
    properties:
      - type: Documentation
        url: https://journals.itb.ac.id/
      - type: OAI-PMH
        url: https://journals.itb.ac.id/index.php/index/oai?verb=Identify
  - aid: itb:crossref-membership
    name: Crossref Membership (LPPM ITB)
    x-operator: registry
    description: >-
      ITB is a registered Crossref member through its Institute for Research and
      Community Services (LPPM), which registers the DOIs for the ITB journal
      titles published on journals.itb.ac.id. Member ID 3613, DOI prefix
      10.5614, 6,568 DOIs registered (1,040 current, 5,528 backfile) as read
      from api.crossref.org on 2026-09-01. This is a membership fact about ITB,
      not an ITB-operated API — Crossref's own contract belongs to Crossref and
      is not saved here.
    humanURL: https://www.crossref.org/
    baseURL: https://api.crossref.org/members/3613
    tags: [Crossref, DOI, Registry, Scholarly Publishing, Research]
    properties:
      - type: Registrant
        url: https://api.crossref.org/members/3613
      - type: Prefix
        url: https://api.crossref.org/prefixes/10.5614
  - aid: itb:ror-registration
    name: ROR Registration
    x-operator: registry
    description: >-
      ITB is registered in the Research Organization Registry as
      https://ror.org/00apj8t60 ("Bandung Institute of Technology", acronym ITB,
      Indonesian label "Institut Teknologi Bandung"). Verified live 2026-09-01
      via api.ror.org. A registry membership, not an ITB-operated API; the ROR
      contract belongs to ROR.
    humanURL: https://ror.org/00apj8t60
    baseURL: https://api.ror.org/organizations/00apj8t60
    tags: [ROR, Registry, Research, Persistent Identifiers]
    properties:
      - type: Registrant
        url: https://ror.org/00apj8t60
x-coverage:
  state: covered
  reason: no_public_api
  detail: >-
    ITB's public surface was probed end to end on 2026-09-01 with a browser
    User-Agent and the result is a complete read, not a blocked one. ITB
    publishes no developer portal, no API gateway, no OpenAPI/AsyncAPI/apis.json,
    no llms.txt and no API terms — api.itb.ac.id and data.itb.ac.id do not
    resolve at all, itb.ac.id/apis.json, /llms.txt, /.well-known/security.txt
    and /sitemap.xml all 404, and no open-data portal (CKAN, Socrata or
    otherwise) exists. The two institution-operated machine-readable surfaces
    that do exist were fully harvested rather than merely linked: the OAI-PMH
    provider at journals.itb.ac.id answered Identify and ListSets in full (20
    sets), and the CAS ticket-validation endpoint returned CAS XML. Neither has
    a published contract. Everything else is credential-gated rather than
    documented — the OJS REST API returns 403, gitlab.itb.ac.id redirects to
    /users/sign_in, and akademik.itb.ac.id is a gated academic portal. Two
    pointers carried by the June 2026 profile are dead and were confirmed dead
    again: digilib.itb.ac.id's historical OAI-PMH script and RSS feed still 404
    after the GDL platform migration, and lib.itb.ac.id now returns HTTP 500
    "Database Error", so it is not emitted as a LibraryCatalog pointer. No CNAME
    tenancy was found on any ITB host: journals, login and digilib are plain A
    records, so there is no vendor platform hiding behind an institution
    hostname. There is no central ITB GitHub organization; only faculty and
    student orgs exist, of which STEI-ITB is the verifiable faculty one.
