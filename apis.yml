aid: itb
name: Bandung Institute of Technology
x-type: university
x-category: Institute of Technology
description: >-
  Institut Teknologi Bandung (ITB) is a public technical university in Bandung,
  Indonesia, and one of the country's oldest and most selective engineering and
  science institutions. ITB publishes no developer portal, no API gateway, no
  API terms of service and no specification of any kind — api.itb.ac.id and
  data.itb.ac.id do not resolve, and no open-data portal was found. What it does
  operate, on its own domain and its own address space, are two protocol
  endpoints with no contract behind them: a campus-wide Apereo CAS single
  sign-on whose ticket-validation endpoints return machine-readable CAS XML, and
  an Open Journal Systems installation at journals.itb.ac.id that exposes a live,
  fully open OAI-PMH 2.0 data provider across twenty journal sets. Both are
  institution-operated; neither is institution-specified — the OJS software and
  its REST API are the Public Knowledge Project's, and that REST API is
  credential-gated (403). ITB is additionally a registered Crossref member
  through its research institute LPPM (member 3613, DOI prefix 10.5614, 6,568
  DOIs) and carries a ROR identifier. The Ganesha Digital Library repository is
  publicly browseable but its historical OAI-PMH and RSS endpoints stayed dead
  after a platform migration, and the library site lib.itb.ac.id now returns a
  database error. This profile records institution-operated surfaces with no
  institution-published contract, which is the honest result rather than a gap
  to be padded.
