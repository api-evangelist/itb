reviews:
  - date: '2026-09-01'
    rating: 2
    summary: >-
      Re-profiled under the API Evangelist university pipeline, with operator
      attribution settled before anything was saved. ITB still publishes no
      developer portal, no API gateway and no specification of any kind, and
      api.itb.ac.id / data.itb.ac.id still do not resolve. Two institution-operated
      machine-readable surfaces were confirmed by probe, not by link presence: the
      Apereo CAS ticket-validation endpoints at login.itb.ac.id, which return
      cas:serviceResponse XML, and a previously uncatalogued live OAI-PMH 2.0 data
      provider at journals.itb.ac.id (repositoryName "ITB Journals", adminEmail
      journal@itb.ac.id, 20 sets). Both run on ITB's own domain and address space;
      neither has an ITB-published contract, and the OJS software behind the
      journals platform is the Public Knowledge Project's, so no OJS spec was
      attributed to ITB. Its REST API is credential-gated (403). Two registry
      memberships were evidenced and recorded rather than treated as third-party
      noise: Crossref member 3613 (LPPM ITB, prefix 10.5614, 6,568 DOIs) and ROR
      00apj8t60. DataCite returned zero records for ITB. No SAML or Shibboleth
      metadata exists — shibboleth.itb.ac.id resolves in DNS but serves nothing, and
      the CAS server 404s on both /cas/idp/metadata and OIDC discovery. No CNAME
      tenancy was found on any ITB host, so no vendor platform is hiding behind an
      institution hostname. The digital library's historical OAI-PMH and RSS
      endpoints remain dead, and lib.itb.ac.id has degraded from 200 to a 500
      database error since the June review; it is no longer emitted as a pointer.
      Nothing was fabricated and no vendor contract was saved.
