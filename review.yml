reviews:
  - date: '2026-06-03'
    rating: 1
    summary: >-
      ITB has no public developer portal or documented API program. Verified
      live: the official site, a CAS-based single sign-on at login.itb.ac.id
      (CAS login endpoint resolves 200), and the Ganesha Digital Library (GDL)
      institutional repository (200). The digital library was historically an
      OAI-PMH data provider, but every previously documented OAI-PMH/RSS path
      now returns 404 after a platform migration, so no current machine-readable
      harvesting endpoint could be confirmed. There is no central official ITB
      GitHub org (only student/department orgs), and api.itb.ac.id /
      data.itb.ac.id do not resolve. No endpoints were fabricated; gated and
      dead surfaces are reported honestly.
    endpoints:
